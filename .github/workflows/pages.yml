name: Публикация вики на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Собрать статические страницы и карту сайта
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          SITE_REPOSITORY: ${{ github.repository }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
        run: |
          node scripts/build-pages.mjs --url "$PAGES_URL" --repository "$SITE_REPOSITORY" --output _site
          node tests/github-pages.test.mjs _site "$PAGES_URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
